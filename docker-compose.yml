# =============================================================================
# DRINK WATER API (PHOENIX) - DOCKER COMPOSE CONFIGURATION
# =============================================================================
# Automatically loads .env file from the same directory when running:
#   docker compose up -d
#
# All variables use ${VAR:-default} syntax so the file works with or without
# a .env file.  Copy .env.example to .env to customise values.
# =============================================================================

networks:
  drink_water_net:
    name: drink_water_net
    driver: bridge

services:
  db:
    container_name: drink_water_db
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    restart: unless-stopped
    networks:
      - drink_water_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-drink_water_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-drink_water_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-512M}
          cpus: "${POSTGRES_CPU_LIMIT:-0.5}"
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Observability Stack
  # ---------------------------------------------------------------------------

  prometheus:
    container_name: drink_water_prometheus
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    networks:
      - drink_water_net
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  loki:
    container_name: drink_water_loki
    image: grafana/loki:3.0.0
    restart: unless-stopped
    user: "0"
    networks:
      - drink_water_net
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki/local-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki/data
    command: -config.file=/etc/loki/local-config.yaml
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  promtail:
    container_name: drink_water_promtail
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    networks:
      - drink_water_net
    volumes:
      - ./infra/promtail/config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/drink_water:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  grafana:
    container_name: drink_water_grafana
    image: grafana/grafana:11.0.0
    restart: unless-stopped
    networks:
      - drink_water_net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

volumes:
  pgdata:
    name: drink_water_pgdata
  prometheus_data:
    name: drink_water_prometheus
  loki_data:
    name: drink_water_loki
  grafana_data:
    name: drink_water_grafana
